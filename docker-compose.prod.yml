services:
  backend:
    image: ${GHCR_IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    container_name: plantify-backend
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - plantify_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${GHCR_IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    container_name: plantify-frontend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  plantify_data: