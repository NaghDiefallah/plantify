services:
  backend:
    image: ${GHCR_IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    env_file:
      - backend/.env
    volumes:
      - plantify_data:/data
    restart: unless-stopped

  frontend:
    image: ${GHCR_IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  plantify_data:
  caddy_data:
  caddy_config:
