name: Build, Publish, and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  VPS_APP_DIR: /root/plantify
  SECURITY_SCAN_ENFORCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
  SLO_GATE_ENFORCE: "false"
  PIP_AUDIT_IGNORE_IDS: "CVE-2026-28500"

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -Ev '^(torch|torchvision)==|^$' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Validate backend dependency graph
        run: python -m pip check

      - name: Scan repository dependencies (Trivy)
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.56.2 \
            fs --scanners vuln --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed .

      - name: Enforce repository vulnerability policy (Trivy)
        if: env.SECURITY_SCAN_ENFORCE == 'true'
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.56.2 \
            fs --scanners vuln --pkg-types library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

      - name: Scan backend Python dependencies (pip-audit)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r /tmp/requirements-ci.txt --ignore-vuln "${PIP_AUDIT_IGNORE_IDS}" || true

      - name: Enforce backend Python vulnerability policy (pip-audit)
        if: env.SECURITY_SCAN_ENFORCE == 'true'
        run: |
          python -m pip_audit -r /tmp/requirements-ci.txt --ignore-vuln "${PIP_AUDIT_IGNORE_IDS}"

      - name: Validate production settings policy
        working-directory: backend
        env:
          APP_ENV: production
          SECRET_KEY: this-is-a-ci-validation-secret-key-with-32-chars
          ROLE_ELEVATION_CODE: this-is-a-ci-role-elevation-code
          CORS_ORIGINS: https://plantify.example.com
          SQLITE_PATH: /tmp/plantify-ci.db
        run: python -c "from app.core.config import Settings; Settings()"

      - name: Validate backend import safety without ML extras
        working-directory: backend
        run: python -c "from app.main import build_security_headers; assert callable(build_security_headers)"

      - name: Run backend integration tests
        working-directory: backend
        run: python -m pytest tests -q --junitxml=/tmp/backend-pytest.xml

      - name: Upload backend pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-backend-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: /tmp/backend-pytest.xml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Lint and build frontend
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run lint
          bun run build

      - name: Enforce frontend lockfile consistency
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "frontend/package-lock.json detected. Use Bun lockfile only for this project." >&2
            exit 1
          fi

          git diff --exit-code -- frontend/bun.lock

      - name: Validate production Compose file
        run: docker compose -f docker-compose.prod.yml config > /dev/null

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality-gates
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_prefix: ${{ steps.vars.outputs.image_prefix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: vars
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          IMAGE_PREFIX="${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "image_prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-backend:latest
            ${{ steps.vars.outputs.image_prefix }}-backend:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}-frontend:latest
            ${{ steps.vars.outputs.image_prefix }}-frontend:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Pull built images for scanning
        run: |
          docker pull "${{ steps.vars.outputs.image_prefix }}-backend:${{ steps.vars.outputs.image_tag }}"
          docker pull "${{ steps.vars.outputs.image_prefix }}-frontend:${{ steps.vars.outputs.image_tag }}"

      - name: Scan backend image vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ steps.vars.outputs.image_prefix }}-backend:${{ steps.vars.outputs.image_tag }}"

      - name: Scan frontend image vulnerabilities (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ steps.vars.outputs.image_prefix }}-frontend:${{ steps.vars.outputs.image_tag }}"

      - name: Enforce backend image vulnerability policy (Trivy)
        if: env.SECURITY_SCAN_ENFORCE == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.vars.outputs.image_prefix }}-backend:${{ steps.vars.outputs.image_tag }}"

      - name: Enforce frontend image vulnerability policy (Trivy)
        if: env.SECURITY_SCAN_ENFORCE == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.vars.outputs.image_prefix }}-frontend:${{ steps.vars.outputs.image_tag }}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.VPS_APP_DIR || env.VPS_APP_DIR }}
          strip_components: 0

      - name: Deploy containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_IMAGE_PREFIX: ${{ needs.build-and-push.outputs.image_prefix }}
          SLO_GATE_ENFORCE: ${{ env.SLO_GATE_ENFORCE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          BACKEND_ENV_FILE: ${{ secrets.BACKEND_ENV_FILE }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || env.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: IMAGE_TAG,GHCR_IMAGE_PREFIX,SLO_GATE_ENFORCE,GHCR_USERNAME,GHCR_PAT,BACKEND_ENV_FILE,VPS_APP_DIR
          script: |
            set -euo pipefail

            mkdir -p "$VPS_APP_DIR/backend"
            cd "$VPS_APP_DIR"

            if [ -n "${BACKEND_ENV_FILE:-}" ]; then
              printf '%s\n' "$BACKEND_ENV_FILE" > backend/.env
              chmod 600 backend/.env
            fi

            if [ -z "${GHCR_USERNAME:-}" ] || [ -z "${GHCR_PAT:-}" ]; then
              echo "GHCR_USERNAME and GHCR_PAT must be configured for VPS pulls." >&2
              exit 1
            fi

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            BACKEND_PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' plantify-backend 2>/dev/null || true)
            FRONTEND_PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' plantify-frontend 2>/dev/null || true)
            PREV_TAG=""
            if [ -n "${BACKEND_PREV_IMAGE}" ]; then
              case "$BACKEND_PREV_IMAGE" in
                "${GHCR_IMAGE_PREFIX}-backend:"*)
                  PREV_TAG="${BACKEND_PREV_IMAGE##*:}"
                  ;;
              esac
            fi

            verify_smoke() {
              for PASS in 1 2; do
                curl -fsS http://127.0.0.1:18000/ready > /dev/null
                curl -fsSI http://127.0.0.1:13000 > /dev/null
                sleep 2
              done
            }

            rollback_to_previous_release() {
              if [ -z "${PREV_TAG}" ] || [ "${PREV_TAG}" = "${IMAGE_TAG}" ]; then
                echo "No previous image tag available for rollback." >&2
                return 1
              fi

              echo "Rolling back deployment to previous tag: ${PREV_TAG}"
              export IMAGE_TAG="${PREV_TAG}" GHCR_IMAGE_PREFIX

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180

              verify_smoke
            }

            export IMAGE_TAG GHCR_IMAGE_PREFIX

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180

            if ! verify_smoke; then
              echo "Post-deploy smoke checks failed. Attempting rollback..." >&2
              rollback_to_previous_release || true
              echo "Deployment failed and rollback was attempted." >&2
              exit 1
            fi

            SLO_JSON=$(curl -fsS http://127.0.0.1:18000/slo)
            echo "SLO snapshot: ${SLO_JSON}"

            if [ "${SLO_GATE_ENFORCE:-false}" = "true" ]; then
              if ! printf '%s' "$SLO_JSON" | grep -Eq '"enforceable_slo_ok"[[:space:]]*:[[:space:]]*true'; then
                echo "SLO gate failed: enforceable_slo_ok is false" >&2
                echo "Attempting rollback after SLO gate failure..." >&2
                rollback_to_previous_release || true
                exit 1
              fi
            fi

            docker compose -f docker-compose.prod.yml ps

            docker image prune -f --filter "until=168h"