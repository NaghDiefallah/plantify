name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.11'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-charts-plugin

      - name: Build documentation
        run: |
          mkdocs build --verbose
          # Verify build output
          if [ ! -d "site" ]; then
            echo "Documentation build failed - site directory not created"
            exit 1
          fi
          echo "✓ Documentation built successfully"
          du -sh site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'site/'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material mkdocs-charts-plugin

      - name: Check markdown syntax
        run: |
          # Check for common markdown issues
          find docs -name "*.md" -type f | while read file; do
            if grep -q "^\[.*\](\s*)" "$file"; then
              echo "⚠️ Warning: Empty links found in $file"
            fi
            if grep -q "^\!\[.*\](\s*)" "$file"; then
              echo "⚠️ Warning: Empty image references found in $file"
            fi
          done

      - name: Validate mkdocs config
        run: mkdocs build --strict

      - name: Check for broken references
        run: |
          echo "Note: Manual review of links recommended in documentation."
          echo "Using mkdocs validate with strict mode."
