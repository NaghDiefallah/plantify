name: Weekly Reliability Digest

on:
  schedule:
    - cron: "30 0 * * 1"
  workflow_dispatch:

concurrency:
  group: reliability-digest-weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  INCLUDE_ROUTE_METRICS: "true"

jobs:
  reliability-digest:
    name: Build Weekly Reliability Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate SLO endpoint configuration
        run: |
          if [ -z "${{ secrets.PROD_SLO_URL }}" ]; then
            echo "PROD_SLO_URL secret is required" >&2
            exit 1
          fi

      - name: Fetch SLO snapshot
        run: |
          set -euo pipefail
          SLO_JSON=$(curl --retry 3 --retry-delay 2 --max-time 20 -fsS "${{ secrets.PROD_SLO_URL }}")
          printf '%s' "$SLO_JSON" > /tmp/reliability-slo.json

      - name: Fetch route metrics snapshot (optional)
        env:
          PROD_METRICS_URL: ${{ secrets.PROD_METRICS_URL }}
        run: |
          set -euo pipefail
          if [ "${INCLUDE_ROUTE_METRICS}" = "true" ] && [ -n "${PROD_METRICS_URL:-}" ]; then
            METRICS_JSON=$(curl --retry 3 --retry-delay 2 --max-time 20 -fsS "$PROD_METRICS_URL")
            printf '%s' "$METRICS_JSON" > /tmp/reliability-metrics.json
          else
            echo "{}" > /tmp/reliability-metrics.json
          fi

      - name: Build markdown digest
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          slo = json.loads(open('/tmp/reliability-slo.json', 'r', encoding='utf-8').read())
          metrics = json.loads(open('/tmp/reliability-metrics.json', 'r', encoding='utf-8').read())

          ts = datetime.now(timezone.utc).isoformat()
          rows = []
          for route, values in metrics.items():
            rows.append(
              {
                'route': route,
                'requests_total': int(values.get('requests_total', 0)),
                'errors_total': int(values.get('errors_total', 0)),
                'p95': float(values.get('latency_seconds_p95', 0.0)),
              }
            )

          rows.sort(key=lambda r: (r['p95'], r['requests_total']), reverse=True)
          top_rows = rows[:10]

          lines = []
          lines.append('# Weekly Reliability Digest')
          lines.append('')
          lines.append(f'- generated_utc: {ts}')
          lines.append(f"- enforceable_slo_ok: {slo.get('enforceable_slo_ok')}")
          lines.append(f"- enough_data: {slo.get('enough_data')}")
          lines.append(f"- requests_total: {slo.get('requests_total')}")
          lines.append(f"- errors_total: {slo.get('errors_total')}")
          lines.append(f"- availability: {slo.get('availability')}")
          lines.append(f"- error_rate: {slo.get('error_rate')}")
          lines.append(f"- latency_seconds_p95: {slo.get('latency_seconds_p95')}")
          lines.append(f"- target_availability: {slo.get('target_availability')}")
          lines.append(f"- target_latency_seconds_p95: {slo.get('target_latency_seconds_p95')}")
          lines.append('')
          lines.append('## Top Route p95 (Current Snapshot)')
          lines.append('')
          lines.append('| Route | Requests | Errors | p95 (s) |')
          lines.append('|---|---:|---:|---:|')
          for r in top_rows:
            lines.append(f"| {r['route']} | {r['requests_total']} | {r['errors_total']} | {r['p95']:.6f} |")

          if not top_rows:
            lines.append('| _no route metrics available_ | 0 | 0 | 0.000000 |')

          with open('/tmp/reliability-digest.md', 'w', encoding='utf-8') as f:
            f.write('\n'.join(lines) + '\n')
          PY

      - name: Upload reliability digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reliability-digest-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            /tmp/reliability-slo.json
            /tmp/reliability-metrics.json
            /tmp/reliability-digest.md
