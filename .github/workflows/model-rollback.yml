name: Model Rollback Control

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Target model version (leave empty to select previous active version)"
        required: false
        default: ""
      apply:
        description: "Apply rollback in registry artifact"
        type: boolean
        required: false
        default: false

jobs:
  rollback-plan:
    name: Create Model Rollback Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate rollback plan
        env:
          INPUT_TARGET_VERSION: ${{ github.event.inputs.target_version }}
          INPUT_APPLY: ${{ github.event.inputs.apply }}
        run: |
          ARGS=()
          if [ -n "${INPUT_TARGET_VERSION}" ]; then
            ARGS+=(--target-version "${INPUT_TARGET_VERSION}")
          fi

          if [ "${INPUT_APPLY}" = "true" ]; then
            ARGS+=(--apply)
          fi

          python backend/scripts/model_rollback.py \
            --registry backend/model/model_registry.json \
            --out /tmp/model-rollback-plan.json \
            "${ARGS[@]}"

          cp backend/model/model_registry.json /tmp/model-registry-after-rollback.json

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            /tmp/model-rollback-plan.json
            /tmp/model-registry-after-rollback.json
