name: Model Governance

on:
  schedule:
    - cron: "20 1 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "Model version identifier"
        required: false
        default: ""
      set_active:
        description: "Set new version as active"
        type: boolean
        required: false
        default: false

concurrency:
  group: model-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASELINE_MAX_SAMPLES: "300"

jobs:
  baseline-and-registry:
    name: Baseline Evaluation and Registry Tracking
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model governance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow onnxruntime

      - name: Run offline baseline evaluation
        run: |
          python backend/scripts/evaluate_model_baseline.py \
            --onnx backend/model/plantify_model.onnx \
            --labels backend/model/classes.json \
            --dataset dataset/color \
            --max-samples ${BASELINE_MAX_SAMPLES} \
            --out /tmp/model-baseline-eval.json

      - name: Register model artifact metadata
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_SET_ACTIVE: ${{ github.event.inputs.set_active }}
        run: |
          VERSION="${INPUT_VERSION}"
          if [ -z "${VERSION}" ]; then
            VERSION="ci-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          ARGS=()
          if [ "${INPUT_SET_ACTIVE:-false}" = "true" ]; then
            ARGS+=(--set-active)
          fi

          python backend/scripts/model_registry.py \
            --registry backend/model/model_registry.json \
            register \
            --version "${VERSION}" \
            --checkpoint plantify_model.pth \
            --onnx backend/model/plantify_model.onnx \
            --labels backend/model/classes.json \
            --source-type governance \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            "${ARGS[@]}"

          cp backend/model/model_registry.json /tmp/model-registry.json

      - name: Build governance summary artifact
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          baseline = json.loads(Path('/tmp/model-baseline-eval.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('/tmp/model-registry.json').read_text(encoding='utf-8'))

          summary = {
              'generated_utc': datetime.now(timezone.utc).isoformat(),
              'active_version': registry.get('active_version', ''),
              'versions_tracked': len(registry.get('versions', [])),
              'baseline_samples': baseline.get('samples_evaluated', 0),
              'baseline_top1_accuracy': baseline.get('top1_accuracy', 0.0),
              'drift_proxy': baseline.get('drift_proxy', {}),
          }

          Path('/tmp/model-governance-summary.json').write_text(
              json.dumps(summary, ensure_ascii=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload model governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-governance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            /tmp/model-baseline-eval.json
            /tmp/model-registry.json
            /tmp/model-governance-summary.json
