name: QA and Release Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-release-governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-integration:
    name: Backend Integration Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -Ev '^(torch|torchvision)==|^$' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Validate backend import safety without ML extras
        working-directory: backend
        run: python -c "from app.main import build_security_headers; assert callable(build_security_headers)"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q --junitxml=/tmp/backend-pytest.xml

      - name: Upload backend pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: /tmp/backend-pytest.xml

  frontend-e2e:
    name: Frontend Build and E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - name: Run frontend e2e smoke checks
        working-directory: frontend
        run: bun run e2e:smoke

  release-traceability:
    name: Release Traceability Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-integration, frontend-e2e]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release traceability artifacts
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          artifact_candidates = {
              'checkpoint': ('plantify_model.pth', 'backend/plantify_model.pth'),
              'onnx': ('model/plantify_model.onnx', 'backend/model/plantify_model.onnx'),
              'labels': ('model/classes.json', 'backend/model/classes.json'),
              'registry': ('model/model_registry.json', 'backend/model/model_registry.json'),
          }

          artifacts = {}
          missing_artifacts = []

          for logical_name, candidates in artifact_candidates.items():
              resolved_path = None
              for candidate in candidates:
                  path = Path(candidate)
                  if path.exists():
                      resolved_path = path
                      break

              if resolved_path is None:
                  missing_artifacts.append(
                      {
                          'name': logical_name,
                          'candidates': list(candidates),
                      }
                  )
                  continue

              artifacts[str(resolved_path).replace('\\', '/')] = {
                  'logical_name': logical_name,
                  'sha256': sha256(resolved_path),
                  'size_bytes': resolved_path.stat().st_size,
              }

          manifest = {
              'generated_utc': datetime.now(timezone.utc).isoformat(),
              'repository': os.environ.get('GITHUB_REPOSITORY', ''),
              'commit_sha': os.environ.get('GITHUB_SHA', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'workflow': os.environ.get('GITHUB_WORKFLOW', ''),
              'artifacts': artifacts,
              'missing_artifacts': missing_artifacts,
          }

          out = Path('/tmp/release-traceability.json')
          out.write_text(json.dumps(manifest, ensure_ascii=True, indent=2) + '\n', encoding='utf-8')

          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('/tmp/release-traceability.sha256').write_text(digest + '  release-traceability.json\n', encoding='utf-8')
          PY

      - name: Upload release traceability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-traceability-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            /tmp/release-traceability.json
            /tmp/release-traceability.sha256
