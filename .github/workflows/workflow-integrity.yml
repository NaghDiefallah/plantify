name: Workflow Integrity

on:
  pull_request:
    paths:
      - .github/workflows/*.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/*.yml
  workflow_dispatch:

concurrency:
  group: workflow-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub Actions Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest

      - name: Validate workflow YAML parsing
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          files = sorted(pathlib.Path('.github/workflows').glob('*.yml'))
          for f in files:
              yaml.safe_load(f.read_text(encoding='utf-8'))
          print(f'Validated YAML for {len(files)} workflow file(s).')
          PY
