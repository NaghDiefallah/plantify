name: Telegram Notifications

on:
  workflow_run:
    workflows: ["Build, Publish, and Deploy"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: sh

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SKIP_NOTIFICATION: "false"

    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::warning::Telegram secrets are not configured. Skipping notification."
            echo "SKIP_NOTIFICATION=true" >> "$GITHUB_ENV"
          fi

      - name: Build and send notification
        if: env.SKIP_NOTIFICATION != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'No commit message available' }}
          CHATBOT_MODEL_NAME: ${{ secrets.CHATBOT_MODEL_NAME || 'mistral' }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          workflow_name = os.environ.get("WORKFLOW_NAME", "unknown")
          conclusion = os.environ.get("CONCLUSION", "unknown")
          repo = os.environ.get("REPO", "")
          branch = os.environ.get("BRANCH", "")
          commit_sha = os.environ.get("COMMIT_SHA", "")
          run_url = os.environ.get("RUN_URL", "")
          actor = os.environ.get("ACTOR", "")
          commit_msg = os.environ.get("COMMIT_MSG", "No commit message available")
          chatbot_model = os.environ.get("CHATBOT_MODEL_NAME", "mistral")
          plant_model_version = "managed-by-deploy"

          status_map = {
              "success": ("✅", "Successful"),
              "failure": ("❌", "Failed"),
              "cancelled": ("⚠️", "Cancelled"),
              "timed_out": ("⏰", "Timed Out"),
          }
          emoji, status_label = status_map.get(conclusion, ("ℹ️", conclusion))

          short_sha = commit_sha[:7] if commit_sha else "unknown"
          timestamp = datetime.now(timezone.utc).strftime("%b %d, %Y • %H:%M UTC")
          first_line = (commit_msg.splitlines() or ["No commit message available"])[0][:80]
          safe_msg = html.escape(first_line)

          message = (
              f"{emoji} <b>Plantify CI/CD</b> | {html.escape(status_label)}\n"
              "━━━━━━━━━━━━━━━━━━━━━━━━\n\n"
              "📦 <b>Workflow</b>\n"
              f"└ {html.escape(workflow_name)}\n\n"
              "🌿 <b>Branch</b>\n"
              f"└ <code>{html.escape(branch)}</code>\n\n"
              "🔗 <b>Commit</b>\n"
              f"└ <a href=\"https://github.com/{html.escape(repo)}/commit/{html.escape(commit_sha)}\">{html.escape(short_sha)}</a> - <i>{safe_msg}</i>\n\n"
              "👤 <b>Author</b>\n"
              f"└ <a href=\"https://github.com/{html.escape(actor)}\">@{html.escape(actor)}</a>\n"
              "\n"
              "🧠 <b>Plant Model</b>\n"
              f"└ <code>{html.escape(plant_model_version)}</code>\n\n"
              "🤖 <b>Chatbot Model</b>\n"
              f"└ <code>{html.escape(chatbot_model)}</code>\n\n"
              "🗂️ <b>Env Sync</b>\n"
              "└ <code>.env</code>, <code>backend/.env</code>, <code>frontend/.env.production</code>\n"
              "└ Provisioned automatically during deploy\n\n"
              "🕐 <b>Timestamp</b>\n"
              f"└ {html.escape(timestamp)}\n\n"
              "━━━━━━━━━━━━━━━━━━━━━━━━\n"
              f"🔍 <a href=\"{html.escape(run_url)}\">View Full Run Details →</a>"
          )

          body = json.dumps(
              {
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
              }
          ).encode("utf-8")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          retries = 3
          delay = 2

          for attempt in range(1, retries + 1):
              req = urllib.request.Request(url, data=body, method="POST")
              req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      if resp.status == 200:
                          print(f"Notification sent successfully (attempt {attempt}/{retries})")
                          raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  print(f"::warning::Attempt {attempt}/{retries} failed (HTTP {exc.code})")
              except Exception as exc:
                  print(f"::warning::Attempt {attempt}/{retries} failed ({exc})")

              if attempt < retries:
                  time.sleep(delay)
                  delay *= 2

          raise SystemExit("Failed to send Telegram notification after retries")
          PY