name: Game-Day Drill

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Drill scenario"
        type: choice
        required: true
        options:
          - deploy
          - db
          - inference
      enforce_pass:
        description: "Fail workflow if drill policy indicates a breach"
        type: boolean
        required: false
        default: false

concurrency:
  group: game-day-drill-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DETECT_ROUTE_P95_BUDGET_SECONDS: "1.50"

jobs:
  drill:
    name: Run Game-Day Drill
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate endpoint configuration
        run: |
          if [ -z "${{ secrets.PROD_READY_URL }}" ]; then
            echo "PROD_READY_URL secret is required" >&2
            exit 1
          fi

          if [ -z "${{ secrets.PROD_SLO_URL }}" ]; then
            echo "PROD_SLO_URL secret is required" >&2
            exit 1
          fi

      - name: Fetch live snapshots
        env:
          PROD_METRICS_URL: ${{ secrets.PROD_METRICS_URL }}
        run: |
          set -euo pipefail
          READY_JSON=$(curl --retry 3 --retry-delay 2 --max-time 20 -fsS "${{ secrets.PROD_READY_URL }}")
          SLO_JSON=$(curl --retry 3 --retry-delay 2 --max-time 20 -fsS "${{ secrets.PROD_SLO_URL }}")
          printf '%s' "$READY_JSON" > /tmp/drill-ready.json
          printf '%s' "$SLO_JSON" > /tmp/drill-slo.json

          if [ -n "${PROD_METRICS_URL:-}" ]; then
            METRICS_JSON=$(curl --retry 3 --retry-delay 2 --max-time 20 -fsS "$PROD_METRICS_URL")
            printf '%s' "$METRICS_JSON" > /tmp/drill-metrics.json
          else
            echo "{}" > /tmp/drill-metrics.json
          fi

      - name: Evaluate drill policy and write report
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          ENFORCE_PASS: ${{ github.event.inputs.enforce_pass }}
          DETECT_ROUTE_P95_BUDGET_SECONDS: ${{ env.DETECT_ROUTE_P95_BUDGET_SECONDS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          scenario = os.environ.get('SCENARIO', 'deploy')
          enforce_pass = os.environ.get('ENFORCE_PASS', 'false').lower() == 'true'
          detect_budget = float(os.environ.get('DETECT_ROUTE_P95_BUDGET_SECONDS', '1.50'))

          ready = json.loads(open('/tmp/drill-ready.json', 'r', encoding='utf-8').read())
          slo = json.loads(open('/tmp/drill-slo.json', 'r', encoding='utf-8').read())
          metrics = json.loads(open('/tmp/drill-metrics.json', 'r', encoding='utf-8').read())

          failures = []
          checks = []

          ready_ok = str(ready.get('status', '')).lower() == 'ready'
          checks.append(f'ready_status={ready.get("status")}')
          if not ready_ok:
            failures.append('ready_not_ready')

          enforceable = bool(slo.get('enforceable_slo_ok', False))
          policy_status = str(slo.get('policy_status', 'unknown'))
          checks.append(f'enforceable_slo_ok={enforceable}')
          checks.append(f'policy_status={policy_status}')

          if scenario == 'deploy':
            if not enforceable:
              failures.append('deploy_policy_breach')

          elif scenario == 'db':
            if not ready_ok:
              failures.append('db_readiness_failure')
            if policy_status == 'breach':
              failures.append('db_policy_breach')

          elif scenario == 'inference':
            detect_metrics = metrics.get('/api/detect', {})
            detect_p95 = float(detect_metrics.get('latency_seconds_p95', 0.0) or 0.0)
            checks.append(f'detect_route_p95={detect_p95}')
            checks.append(f'detect_route_budget={detect_budget}')
            if detect_metrics and detect_p95 > detect_budget:
              failures.append('inference_latency_budget_exceeded')

          report = {
            'generated_utc': datetime.now(timezone.utc).isoformat(),
            'scenario': scenario,
            'enforce_pass': enforce_pass,
            'checks': checks,
            'failures': failures,
            'result': 'pass' if not failures else 'fail',
          }

          with open('/tmp/game-day-report.json', 'w', encoding='utf-8') as f:
            f.write(json.dumps(report, ensure_ascii=False, indent=2) + '\n')

          lines = [
            '# Game-Day Drill Report',
            '',
            f"- generated_utc: {report['generated_utc']}",
            f"- scenario: {report['scenario']}",
            f"- result: {report['result']}",
            f"- enforce_pass: {report['enforce_pass']}",
            '',
            '## Checks',
          ]
          for item in checks:
            lines.append(f'- {item}')

          lines.append('')
          lines.append('## Failures')
          if failures:
            for item in failures:
              lines.append(f'- {item}')
          else:
            lines.append('- none')

          with open('/tmp/game-day-report.md', 'w', encoding='utf-8') as f:
            f.write('\n'.join(lines) + '\n')

          if enforce_pass and failures:
            print('Game-day drill failed under enforced mode', file=sys.stderr)
            sys.exit(1)
          PY

      - name: Upload drill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-day-drill-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            /tmp/drill-ready.json
            /tmp/drill-slo.json
            /tmp/drill-metrics.json
            /tmp/game-day-report.json
            /tmp/game-day-report.md
