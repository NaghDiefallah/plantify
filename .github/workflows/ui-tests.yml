name: UI Tests (Headless)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ui-tests:
    name: Run Headless E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright UI tests
        working-directory: frontend
        continue-on-error: true
        run: |
          npx playwright test --config=playwright.config.ts \
            --reporter=html,json,junit \
            --junit-output-file=test-results/junit.xml

      - name: Generate test report
        if: always()
        run: |
          echo "## 🧪 UI Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "frontend/test-results.json" ]; then
            python3 - <<'EOF'
          import json
          with open('frontend/test-results.json', 'r') as f:
            results = json.load(f)
            stats = results.get('stats', {})
            print(f"- ✅ Passed: {stats.get('expected', 0)}")
            print(f"- ❌ Failed: {stats.get('unexpected', 0)}")
            print(f"- ⏭️  Skipped: {stats.get('skipped', 0)}")
            print(f"- ⏱️  Duration: {stats.get('duration', 0) / 1000:.1f}s")
          EOF
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: frontend/test-results/junit.xml
          check_name: "UI Test Results"
          comment_mode: always

  accessibility-audit:
    name: Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        run: npm run build

      - name: Run accessibility scan with Pa11y
        working-directory: frontend
        continue-on-error: true
        run: |
          npx pa11y-ci --config .pa11yci.json || echo "Some accessibility issues found (non-blocking)"

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          runs: 1
