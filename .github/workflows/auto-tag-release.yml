name: Auto Tag Release

on:
  workflow_run:
    workflows: ["Build, Publish, and Deploy"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: auto-tag-release-main
  cancel-in-progress: false

jobs:
  tag-release:
    name: Create Next Patch Tag
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next patch version
        id: version
        run: |
          set -euo pipefail

          git fetch --tags --force

          # Ignore pre-release tags (e.g. v0.2.0-rc3) — find latest stable semver only
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "${LATEST_TAG:-}" ]; then
            NEXT_TAG="v0.1.0"
          else
            if [[ ! "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest tag '$LATEST_TAG' is not semver (vMAJOR.MINOR.PATCH)." >&2
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEXT_PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          fi

          echo "latest_tag=${LATEST_TAG:-none}" >> "$GITHUB_OUTPUT"
          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists. Nothing to do."
            exit 0
          fi

          git tag -a "$NEXT_TAG" "$SOURCE_SHA" -m "Auto release $NEXT_TAG"
          git push origin "$NEXT_TAG"

      - name: Summary
        run: |
          echo "Auto-tag complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous tag: ${{ steps.version.outputs.latest_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- New tag: ${{ steps.version.outputs.next_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_STEP_SUMMARY"
