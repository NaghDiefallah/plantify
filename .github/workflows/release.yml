name: Cross-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  FRONTEND_DIR: frontend
  NEXT_PUBLIC_APP_STAGE: production
  NEXT_PUBLIC_PRODUCTION_API_URL: ${{ secrets.NEXT_PUBLIC_PRODUCTION_API_URL || 'https://api.plantify.limarise.com/api' }}

jobs:
  web-assets:
    name: Web / Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Build strict static export
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          PLATFORM_TARGET: static
        run: npm run build

      - name: Upload static web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: frontend/out

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: web-assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Download static web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/out

      - name: Create Android native project
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android signing config
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/app/plantify-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Using configured Android signing secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_MODE=release-secrets" >> "$GITHUB_ENV"
          else
            echo "Signing secrets not found. Generating placeholder keystore for CI build artifacts."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_MODE=placeholder" >> "$GITHUB_ENV"
          fi

      - name: Build Android release artifacts
        working-directory: ${{ env.FRONTEND_DIR }}/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign Android APK and AAB
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -n 1)
          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB_UNSIGNED="android/app/build/outputs/bundle/release/app-release.aab"
          APK_SIGNED="android/app/build/outputs/apk/release/plantify-${GITHUB_REF_NAME}-android.apk"
          AAB_SIGNED="android/app/build/outputs/bundle/release/plantify-${GITHUB_REF_NAME}-android.aab"

          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "Expected APK not found at $APK_UNSIGNED"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi

          if [ ! -f "$AAB_UNSIGNED" ]; then
            echo "Expected AAB not found at $AAB_UNSIGNED"
            ls -la android/app/build/outputs/bundle/release || true
            exit 1
          fi

          cp "$AAB_UNSIGNED" "$AAB_SIGNED"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB_SIGNED" "$ANDROID_KEY_ALIAS"

      - name: Display Android signing mode
        run: |
          echo "Android signing mode: $ANDROID_SIGNING_MODE"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            frontend/android/app/build/outputs/apk/release/plantify-*.apk
            frontend/android/app/build/outputs/bundle/release/plantify-*.aab

  ios:
    name: iOS
    runs-on: macos-latest
    needs: web-assets
    outputs:
      ios_enabled: ${{ steps.ios_signing.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Download static web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/out

      - name: Detect iOS signing inputs
        id: ios_signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [ -n "${IOS_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${IOS_CERTIFICATE_PASSWORD:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ] && [ -n "${IOS_TEAM_ID:-}" ] && [ -n "${IOS_BUNDLE_IDENTIFIER:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_NAME:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing inputs detected."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing inputs missing; skipping iOS artifact build."
          fi

      - name: Create iOS native project
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods dependencies
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.FRONTEND_DIR }}/ios/App
        run: pod install

      - name: Import iOS signing assets
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security create-keychain -p "$RUNNER_TEMP/plantify" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP/plantify" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/plantify-cert.p12"
          security import "$RUNNER_TEMP/plantify-cert.p12" \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/plantify.mobileprovision"

      - name: Write export options
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        run: |
          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ secrets.IOS_BUNDLE_IDENTIFIER }}</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive iOS app
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.FRONTEND_DIR }}/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Plantify.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ secrets.IOS_BUNDLE_IDENTIFIER }}" \
            archive

      - name: Export IPA
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Plantify.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-release" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload iOS artifact
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: ${{ runner.temp }}/ios-release/*.ipa

  desktop:
    name: Desktop
    needs: web-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            args: ""
          - runner: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm install

      - name: Download static web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/out

      - name: Build Tauri desktop bundle
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_APP_STAGE: production
          NEXT_PUBLIC_PRODUCTION_API_URL: ${{ secrets.NEXT_PUBLIC_PRODUCTION_API_URL }}
        with:
          projectPath: frontend
          args: ${{ matrix.args }}

      - name: Upload Windows desktop artifact
        if: matrix.runner == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Linux desktop artifact
        if: matrix.runner == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: frontend/src-tauri/target/release/bundle/deb/*.deb

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - android
      - ios
      - desktop

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-assets/android

      - name: Download iOS artifacts
        if: ${{ needs.ios.outputs.ios_enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: release-assets/ios

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets/desktop/windows

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: release-assets/desktop/linux

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/android/**/*.apk
            release-assets/android/**/*.aab
            release-assets/ios/**/*.ipa
            release-assets/desktop/**/*.exe
            release-assets/desktop/**/*.deb