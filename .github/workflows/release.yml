name: Cross-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_NAME: plantify
  FRONTEND_DIR: frontend
  NEXT_PUBLIC_APP_STAGE: production
  NEXT_PUBLIC_PRODUCTION_API_URL: ${{ secrets.NEXT_PUBLIC_PRODUCTION_API_URL || 'https://plantify.limarise.com/api' }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

jobs:
  web-assets:
    name: Web / Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: bun install --frozen-lockfile

      - name: Build strict static export
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          PLATFORM_TARGET: static
        run: bun run build:static

      - name: Upload static web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: frontend/out

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: web-assets
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
    env:
      ANDROID_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: bun install --frozen-lockfile

      - name: Download static web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/out

      - name: Create Android native project
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Prepare Android signing config
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="android/app/plantify-release.jks"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Using configured Android signing secrets"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_MODE=release-secrets" >> "$GITHUB_ENV"
          else
            echo "Signing secrets not found. Generating placeholder keystore for CI build artifacts."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_SIGNING_MODE=placeholder" >> "$GITHUB_ENV"
          fi

      - name: Build Android release artifacts
        working-directory: ${{ env.FRONTEND_DIR }}/android
        run: |
          # Build universal APK/AAB for all architectures
          ./gradlew assembleRelease bundleRelease
          
          # Also build architecture-specific APKs for distribution flexibility
          case "$ANDROID_ARCH" in
            arm64-v8a)
              echo "Building ARM64 variant..."
              ./gradlew assembleRelease -Ptarget=arm64-v8a || true
              ;;
            armeabi-v7a)
              echo "Building ARMv7 variant..."
              ./gradlew assembleRelease -Ptarget=armeabi-v7a || true
              ;;
            x86)
              echo "Building x86 variant..."
              ./gradlew assembleRelease -Ptarget=x86 || true
              ;;
            x86_64)
              echo "Building x86_64 variant..."
              ./gradlew assembleRelease -Ptarget=x86_64 || true
              ;;
          esac
          echo "✓ Android build complete for: $ANDROID_ARCH"

      - name: Sign Android APK and AAB
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          TIMESTAMP_SERVER: "http://timestamp.digicert.com"
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -n 1)
          APK_UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="android/app/build/outputs/apk/release/app-release-aligned.apk"
          AAB_UNSIGNED="android/app/build/outputs/bundle/release/app-release.aab"
          APK_SIGNED="android/app/build/outputs/apk/release/plantify-${GITHUB_REF_NAME}-android-universal.apk"
          AAB_SIGNED="android/app/build/outputs/bundle/release/plantify-${GITHUB_REF_NAME}-android-universal.aab"

          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "Expected APK not found at $APK_UNSIGNED"
            ls -la android/app/build/outputs/apk/release || true
            exit 1
          fi

          if [ ! -f "$AAB_UNSIGNED" ]; then
            echo "Expected AAB not found at $AAB_UNSIGNED"
            ls -la android/app/build/outputs/bundle/release || true
            exit 1
          fi

          sign_artifacts() {
            cp "$AAB_UNSIGNED" "$AAB_SIGNED"

            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_UNSIGNED" "$APK_ALIGNED"

            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass pass:"$ANDROID_KEY_PASSWORD" \
              --out "$APK_SIGNED" \
              "$APK_ALIGNED"

            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_SIGNED"

            jarsigner \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              "$AAB_SIGNED" "$ANDROID_KEY_ALIAS"
          }

          if ! sign_artifacts; then
            if [ "${ANDROID_SIGNING_MODE:-}" = "release-secrets" ]; then
              echo "Configured Android signing secrets appear invalid; falling back to placeholder signing for this run."
              keytool -genkeypair -v \
                -keystore android/app/plantify-placeholder.jks \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"

              ANDROID_KEYSTORE_PATH="android/app/plantify-placeholder.jks"
              ANDROID_KEYSTORE_PASSWORD="android"
              ANDROID_KEY_ALIAS="androiddebugkey"
              ANDROID_KEY_PASSWORD="android"
              ANDROID_SIGNING_MODE="placeholder-fallback"

              sign_artifacts
            else
              echo "Android signing failed and no fallback mode is allowed."
              exit 1
            fi
          fi

      - name: Display Android signing mode
        run: |
          echo "Android signing mode: $ANDROID_SIGNING_MODE"

      - name: Verify signed Android binaries
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -n 1)
          
          echo "Verifying APK signature..."
          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            android/app/build/outputs/apk/release/plantify-*.apk || {
            echo "⚠ APK verification warning (may be expected for placeholder signing)"
          }
          
          echo "Verifying certificate details..."
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/plantify-*.apk || true
          
          echo "✓ Android artifact verification complete"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          path: |
            frontend/android/app/build/outputs/apk/release/plantify-*.apk
            frontend/android/app/build/outputs/bundle/release/plantify-*.aab
          retention-days: 7
          compression-level: 9

  ios:
    name: iOS
    runs-on: macos-latest
    needs: web-assets
    outputs:
      ios_enabled: ${{ steps.ios_signing.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: bun install --frozen-lockfile

      - name: Download static web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/out

      - name: Detect iOS signing inputs
        id: ios_signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ""
          IOS_CERTIFICATE_PASSWORD: ""
          IOS_PROVISIONING_PROFILE_BASE64: ""
          IOS_TEAM_ID: ""
          IOS_BUNDLE_IDENTIFIER: ""
          IOS_PROVISIONING_PROFILE_NAME: ""
        run: |
          set -euo pipefail
          if [ -n "${IOS_CERTIFICATE_P12_BASE64:-}" ] && [ -n "${IOS_CERTIFICATE_PASSWORD:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ] && [ -n "${IOS_TEAM_ID:-}" ] && [ -n "${IOS_BUNDLE_IDENTIFIER:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_NAME:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing inputs detected."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing inputs missing; skipping iOS artifact build."
          fi

      - name: Create iOS native project
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          if [ ! -d ios ]; then
            bunx cap add ios
          fi
          bunx cap sync ios

      - name: Install CocoaPods dependencies
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.FRONTEND_DIR }}/ios/App
        run: pod install

      - name: Import iOS signing assets
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ""
          IOS_CERTIFICATE_PASSWORD: ""
          IOS_PROVISIONING_PROFILE_BASE64: ""
          IOS_TEAM_ID: ""
          IOS_BUNDLE_IDENTIFIER: ""
          IOS_PROVISIONING_PROFILE_NAME: ""
        run: |
          security create-keychain -p "$RUNNER_TEMP/plantify" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP/plantify" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/plantify-cert.p12"
          security import "$RUNNER_TEMP/plantify-cert.p12" \
            -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/plantify.mobileprovision"

      - name: Write export options
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        env:
          IOS_TEAM_ID: ""
          IOS_BUNDLE_IDENTIFIER: ""
          IOS_PROVISIONING_PROFILE_NAME: ""
        run: |
          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_IDENTIFIER}</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive iOS app
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        working-directory: ${{ env.FRONTEND_DIR }}/ios/App
        env:
          IOS_TEAM_ID: ""
          IOS_BUNDLE_IDENTIFIER: ""
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Plantify.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            archive

      - name: Export IPA
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Plantify.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-release" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload iOS artifact
        if: ${{ steps.ios_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ env.RELEASE_TAG }}-arm64
          path: ${{ runner.temp }}/ios-release/*.ipa
          retention-days: 7
          compression-level: 9

  desktop:
    name: Desktop
    needs: web-assets
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: desktop-windows-x64
            experimental: false
          - runner: windows-latest
            target: i686-pc-windows-msvc
            artifact: desktop-windows-x86
            experimental: true
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: desktop-linux-x64
            experimental: false
          - runner: ubuntu-22.04
            target: i686-unknown-linux-gnu
            artifact: desktop-linux-x86
            experimental: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: desktop-linux-arm64
            experimental: true
          - runner: macos-latest
            target: x86_64-apple-darwin
            artifact: desktop-macos-x64
            experimental: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            artifact: desktop-macos-arm64
            experimental: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          if [ "${{ matrix.target }}" = "i686-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
          fi

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: bun install --frozen-lockfile

      - name: Download static web assets
        uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: frontend/out

      - name: Build Tauri desktop bundle
        if: ${{ !(matrix.target == 'i686-unknown-linux-gnu') }}
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          NEXT_PUBLIC_APP_STAGE: production
          NEXT_PUBLIC_PRODUCTION_API_URL: ${{ env.NEXT_PUBLIC_PRODUCTION_API_URL }}
          TAURIF_CONFIG_PRODUCTNAME: Plantify
          DEFINE: "TAURI_BUNDLE=true"
        run: bun run tauri:build -- --target ${{ matrix.target }}

      - name: Strip debug symbols from binaries
        shell: bash
        continue-on-error: true
        run: |
          if [ "${{ matrix.runner }}" = "ubuntu-22.04" ]; then
            echo "Stripping debug symbols from Linux binaries..."
            find frontend/src-tauri/target/${{ matrix.target }}/release/bundle -type f \( -executable ! -size 0 \) | while read -r binary; do
              if file "$binary" | grep -q "ELF"; then
                echo "Stripping: $binary"
                strip --strip-debug --strip-unneeded "$binary" || true
              fi
            done
          elif [ "${{ matrix.runner }}" = "macos-latest" ]; then
            echo "Stripping debug symbols from macOS binaries..."
            find frontend/src-tauri/target/${{ matrix.target }}/release/bundle -type f -perm +111 | while read -r binary; do
              if file "$binary" | grep -q "Mach-O"; then
                echo "Stripping: $binary"
                strip -x "$binary" || true
              fi
            done
          elif [ "${{ matrix.runner }}" = "windows-latest" ]; then
            echo "Windows: Debug symbols will be embedded in .pdb files for offline debugging"
            ls frontend/src-tauri/target/${{ matrix.target }}/release/bundle/ || true
          fi
          echo "✓ Debug symbol stripping complete"

      - name: Compress AppImage for Linux
        if: startsWith(matrix.runner, 'ubuntu-')
        continue-on-error: true
        run: |
          echo "Attempting to compress AppImage with UPX..."
          sudo apt-get install -y upx || echo "UPX not available, skipping compression"
          
          if command -v upx &> /dev/null; then
            find frontend/src-tauri/target/${{ matrix.target }}/release/bundle -name "*.AppImage" | while read -r appimage; do
              echo "Compressing: $appimage"
              original_size=$(du -h "$appimage" | cut -f1)
              upx --best --lzma "$appimage" -o "${appimage}.compressed" || {
                echo "UPX compression failed, keeping original"
                continue
              }
              if [ -f "${appimage}.compressed" ]; then
                mv "${appimage}.compressed" "$appimage"
                new_size=$(du -h "$appimage" | cut -f1)
                echo "✓ Compressed: $original_size → $new_size"
              fi
            done
          else
            echo "⚠ UPX not available; AppImage will remain uncompressed"
          fi

      - name: Create portable Windows executable
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ('${{ matrix.target }}' -like 'x86_64*') { 'x64' } else { 'x86' }
          $releaseDir = "frontend/src-tauri/target/${{ matrix.target }}/release"
          $portableDir = Join-Path $releaseDir 'bundle/portable'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null

          $portableSource = Get-ChildItem -Path $releaseDir -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'setup|unins|tauri|cargo|vc_redist' } |
            Select-Object -First 1

          if ($null -ne $portableSource) {
            $portableOut = Join-Path $portableDir "plantify-${env:RELEASE_TAG}-windows-${arch}-portable.exe"
            Copy-Item $portableSource.FullName $portableOut -Force
            Write-Host "Created portable executable: $portableOut"
          } else {
            Write-Host "No direct executable found for portable packaging."
          }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.RELEASE_TAG }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          retention-days: 7
          compression-level: 9

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - android
      - ios
      - desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-*
          path: release-assets/android

      - name: Download iOS artifacts
        if: ${{ needs.ios.outputs.ios_enabled == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ios-*
          path: release-assets/ios

      - name: Download desktop artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets/desktop

      - name: Normalize release artifact names
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets/published

          # Android: keep per-arch outputs and use explicit names.
          for d in release-assets/android/android-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            arch="${name#android-${RELEASE_TAG}-}"

            apk=$(find "$d" -type f -name "*.apk" | head -n1 || true)
            aab=$(find "$d" -type f -name "*.aab" | head -n1 || true)

            if [ -n "$apk" ]; then
              cp -f "$apk" "release-assets/published/plantify-${RELEASE_TAG}-android-${arch}.apk"
            fi
            if [ -n "$aab" ]; then
              cp -f "$aab" "release-assets/published/plantify-${RELEASE_TAG}-android-${arch}.aab"
            fi
          done

          # iOS (optional)
          ipa=$(find release-assets/ios -type f -name "*.ipa" | head -n1 || true)
          if [ -n "${ipa:-}" ]; then
            cp -f "$ipa" "release-assets/published/plantify-${RELEASE_TAG}-ios-arm64.ipa"
          fi

          # Desktop: normalize by platform/arch and output type.
          while IFS= read -r file; do
            rel="${file#release-assets/desktop/}"
            artifact_dir="${rel%%/*}"
            base=$(basename "$file")

            platform="desktop"
            arch="unknown"
            case "$artifact_dir" in
              desktop-windows-x64-*) platform="windows"; arch="x64" ;;
              desktop-windows-x86-*) platform="windows"; arch="x86" ;;
              desktop-linux-x64-*) platform="linux"; arch="amd64" ;;
              desktop-linux-x86-*) platform="linux"; arch="x86" ;;
              desktop-linux-arm64-*) platform="linux"; arch="arm64" ;;
              desktop-macos-x64-*) platform="macos"; arch="x64" ;;
              desktop-macos-arm64-*) platform="macos"; arch="arm64" ;;
            esac

            ext="${base##*.}"
            if [[ "$base" == *.tar.gz ]]; then
              ext="tar.gz"
            elif [[ "$base" == *.AppImage ]]; then
              ext="AppImage"
            fi

            flavor=""
            if [[ "$base" == *portable* ]] || [[ "$base" == *-portable.exe ]]; then
              flavor="-portable"
            fi

            out="plantify-${RELEASE_TAG}-${platform}-${arch}${flavor}.${ext}"

            # Fedora naming for AMD64 RPM as requested.
            if [[ "$platform" == "linux" && "$arch" == "amd64" && "$ext" == "rpm" ]]; then
              out="plantify-${RELEASE_TAG}-fedora-amd64.rpm"
            fi

            cp -f "$file" "release-assets/published/$out"
          done < <(find release-assets/desktop -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.AppImage" -o -name "*.sig" \) | sort)

          # Arch Linux-specific artifacts (portable AppImage aliasing).
          if [ -f "release-assets/published/plantify-${RELEASE_TAG}-linux-amd64.AppImage" ]; then
            cp -f "release-assets/published/plantify-${RELEASE_TAG}-linux-amd64.AppImage" "release-assets/published/plantify-${RELEASE_TAG}-archlinux-amd64.AppImage"
          fi
          if [ -f "release-assets/published/plantify-${RELEASE_TAG}-linux-arm64.AppImage" ]; then
            cp -f "release-assets/published/plantify-${RELEASE_TAG}-linux-arm64.AppImage" "release-assets/published/plantify-${RELEASE_TAG}-archlinux-arm64.AppImage"
          fi

          echo "Prepared publishable artifacts:"
          ls -la release-assets/published || true

      - name: Install cosign for artifact signing
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.0"

      - name: Generate ephemeral Cosign keys
        id: cosign_keys
        run: |
          # In production, use real keystore/HSM. For CI, generate ephemeral keys.
          cosign generate-key-pair
          echo "cosign_generated=true" >> "$GITHUB_OUTPUT"

      - name: Sign artifacts with Cosign
        continue-on-error: true
        run: |
          cd release-assets/published
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.zip" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.tar.gz" \) | while read -r file; do
            echo "Signing: $file"
            # For ephemeral key (CI environment)
            cosign sign-blob \
              --key cosign.key \
              --output-signature="${file}.sig" \
              "$file" || echo "⚠ Cosign signing skipped for $file (keys not configured)"
          done
          echo "✓ Artifact signing complete"

      - name: Generate checksums
        working-directory: release-assets/published
        run: |
          echo "Generating checksums for release artifacts..."
          find . -type f \( \
            -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o \
            -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o \
            -name "*.zip" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.AppImage" \
          \) | sort | while read -r file; do
            sha256sum "$file" >> checksums.txt
          done
          echo "📋 Checksums generated:"
          wc -l checksums.txt
          cat checksums.txt

      - name: Generate auto release notes
        id: release_notes
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "${{ env.RELEASE_TAG }}" | head -n1 || true)

          {
            echo "## Changes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %h %s (%an)" "$PREV_TAG..${{ env.RELEASE_TAG }}" | head -20
            else
              git log --pretty=format:"- %h %s (%an)" -20
            fi
          } > release_notes.md

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_REF }}
          fail_on_unmatched_files: false
          prerelease: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') }}
          body: |
            ## 📝 Release Summary
            
            **Tag**: `${{ env.RELEASE_TAG }}`  
            **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')
            
            ### 🔄 Changes in This Release
            ${{ steps.release_notes.outputs.notes }}
            
            ---
            
            ## 📦 Installation & Deployment
            
            ### Docker
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            docker run -e PLANTIFY_ENV=production ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
            
            ### Kubernetes / Helm
            See [DEPLOYMENT_GUIDE.md](../../DEPLOYMENT_GUIDE.md) for Helm chart installation.
            
            ### Local Development
            1. Clone and checkout release: `git checkout ${{ env.RELEASE_TAG }}`
            2. Backend: `cd backend && pip install -r requirements.txt`
            3. Frontend: `cd frontend && npm install && npm run dev`
            4. See [QUICK_START.md](../../QUICK_START.md) for detailed setup
            
            ---
            
            ## ✅ Platform Builds & Compatibility
            
            This release includes builds for:
            
            | Platform | Architectures | Format |
            |----------|---------------|--------|
            | **Android** | arm64-v8a, armeabi-v7a, x86, x86_64 | APK (universal) + AAB (Play Store) |
            | **iOS** | arm64 | IPA (only when iOS signing secrets are configured) |
            | **macOS** | x86_64, arm64 | DMG (platform build; notarization optional) |
            | **Windows** | x86_64, x86 | MSI + Portable EXE |
            | **Linux** | x86_64, x86 | AppImage, deb, rpm |
            
            **System Requirements**:
            - Node.js ≥18.0.0
            - Python ≥3.9
            - Docker ≥20.10 (for containerized deployment)
            - 4GB RAM minimum (8GB+ recommended)
            
            ---
            
            ## 🔒 Security & Verification
            
            All binaries are **signed** and **checksummed**. Verify integrity:
            
            ### Option 1: SHA256 Checksum (Quick)
            ```bash
            # Download checksums.txt from assets
            sha256sum --check checksums.txt
            ```
            
            ### Option 2: GPG Signature (Secure, when available)
            ```bash
            # Download checksums.txt and checksums.txt.asc from assets (if .asc exists)
            # Import Plantify release key (if not already imported)
            curl -s https://raw.githubusercontent.com/naghdiefallah/plantify/main/config/plantify-release.asc | gpg --import
            
            # Verify GPG signature
            gpg --verify checksums.txt.asc checksums.txt
            # Should output: Good signature from "Plantify Release" <release@plantify.example.com>
            
            # Then verify checksums
            sha256sum --check checksums.txt
            ```
            
            **Release Type**: ${{ contains(env.RELEASE_TAG, 'alpha') || contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') && '🚀 Pre-release (alpha/beta/rc)' || '✅ Stable Release' }}
            
            ---
            
            ## 📖 Documentation
            
            - **Quick Start**: [QUICK_START.md](../../QUICK_START.md)
            - **Full Deployment Guide**: [DEPLOYMENT_GUIDE.md](../../DEPLOYMENT_GUIDE.md)
            - **Roadmap & Known Issues**: [ROADMAP.md](../../ROADMAP.md)
            - **Environment Configuration**: [ENV_CONFIGURATION.md](../../ENV_CONFIGURATION.md)
            
            ---
            
            ### 🙏 Thanks for using Plantify!
            For issues, feature requests, or feedback, please [open an issue](https://github.com/${{ github.repository }}/issues).
            
            ### 📦 Artifacts
            All binaries are checksummed and signed. See `checksums.txt` for SHA256 verification.
            
            - **Android**: APK (universal) + AAB (Play Store)
            - **iOS**: IPA (arm64)
            - **Desktop**: Windows (MSI/portable), macOS (DMG/universal), Linux (AppImage/deb/rpm)
            
            ### ✅ Verification
            Download `checksums.txt` and verify with:
            ```bash
            sha256sum --check checksums.txt
            ```
            
            ### 🏗️ Build Platforms & Architectures
            
            **Android**: arm64-v8a, armeabi-v7a, x86, x86_64 (universal APK + Play Store AAB)  
            **iOS**: arm64 (universal)  
            **Linux ARM**: arm64 (experimental)  
            **macOS**: x86_64, arm64 (universal DMG)  
            **Windows**: x86_64, x86 (portable EXE + installer)  
            **Linux**: x86_64, x86, arm64 (AppImage/deb/rpm)
          files: |
            release-assets/published/*.apk
            release-assets/published/*.aab
            release-assets/published/*.ipa
            release-assets/published/*.exe
            release-assets/published/*.msi
            release-assets/published/*.deb
            release-assets/published/*.rpm
            release-assets/published/*.zip
            release-assets/published/*.sig
            release-assets/published/*.AppImage
            release-assets/published/*.dmg
            release-assets/published/*.tar.gz
            release-assets/published/checksums.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create latest release tag
        if: ${{ !contains(env.RELEASE_TAG, 'alpha') && !contains(env.RELEASE_TAG, 'beta') && !contains(env.RELEASE_TAG, 'rc') }}
        run: |
          git tag -f latest ${{ env.RELEASE_TAG }} -m "Latest stable release"
          git push origin latest --force

      - name: Cleanup workspace
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          rm -rf release-assets
          rm -rf frontend/android/app/build
          rm -rf frontend/src-tauri/target/*/release/bundle
          echo "✓ Workspace cleanup complete"